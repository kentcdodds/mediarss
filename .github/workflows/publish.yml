name: 🚀 Publish
on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
  pull_request: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  validate:
    name: ✅ Validate
    runs-on: ubuntu-22.04
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v6

      - name: 📦 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: 📥 Install dependencies
        run: npm ci

      # Format, lint, typecheck, and tests (including the Feature Map check).
      - name: ✅ npm run validate
        run: npm run validate

  e2e:
    name: 🎭 Control CLI + Playwright
    runs-on: ubuntu-22.04
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v6

      - name: 📦 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🎭 Install Chromium and ffmpeg
        run: |
          npx playwright install --with-deps --no-shell chromium
          sudo apt-get install -y ffmpeg

      - name: 🕹️ Control CLI smoke
        run: |
          npm run --silent control -- dev --fresh
          npm run --silent control -- doctor
          npm run --silent control -- execute --code-file tools/control-fixtures/curated-feed.ts
          npm run --silent control -- browse --path /admin --wait-for "Your Feeds"
          npm run --silent control -- stop

      - name: 🎭 Playwright
        run: npm run test:playwright

      - name: 📤 Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            data/control/dev.log
          retention-days: 7

  build:
    name: 🐳 Build
    runs-on: ubuntu-22.04
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v6

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🏗️ Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: mediarss:smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            COMMIT_SHA=${{ github.sha }}

      - name: 🧪 Smoke test
        run: |
          # Start the container
          docker run -d --name smoke-test -p 22050:22050 mediarss:smoke-test

          # Wait for the container to be ready (max 30 seconds)
          for i in {1..30}; do
            if [ "$(docker inspect -f '{{.State.Running}}' smoke-test 2>/dev/null)" != "true" ]; then
              echo "❌ Container exited before health check passed!"
              docker logs smoke-test || true
              docker rm -f smoke-test || true
              exit 1
            fi
            if curl -sf http://localhost:22050/health > /dev/null 2>&1; then
              echo "✅ Health check passed!"
              curl -s http://localhost:22050/health | jq .
              docker stop smoke-test
              docker rm smoke-test
              exit 0
            fi
            echo "Waiting for container... ($i/30)"
            sleep 1
          done

          echo "❌ Health check failed!"
          docker logs smoke-test
          docker stop smoke-test
          docker rm smoke-test
          exit 1

  publish:
    name: 🚀 Publish
    runs-on: ubuntu-22.04
    needs: [validate, e2e, build]
    if: ${{ github.event_name == 'push' }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v6

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔑 Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 📝 Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/mediarss
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: 🚀 Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            COMMIT_SHA=${{ github.sha }}
